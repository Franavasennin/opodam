[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 3000

[[redirects]]
  from = "/oposiciones/:slug/"
  to = "/oposiciones/:slug/index.html"
  status = 200

[[redirects]]
  from = "/oposiciones/:slug"
  to = "/oposiciones/:slug/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
